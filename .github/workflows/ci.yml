name: Verify ReviewLens

# Every automatable gate in docs/delivery/release-gates.md runs here. Gate 5 is a
# regression check on a seven-question labelled fixture: it fails the build if lexical
# retrieval drops below the measured baseline. It does not certify retrieval quality.

on: [push, pull_request]
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Gate 1 - types
        run: npx tsc --noEmit

      - name: Gate 2 - lint
        run: npm run lint

      - name: Gates 3 and 4 - behaviour and build
        run: npm test

      - name: Gate 5 - retrieval regression (7-question fixture)
        run: npm run eval

      - name: Publish evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: eval/reports/
          if-no-files-found: ignore
